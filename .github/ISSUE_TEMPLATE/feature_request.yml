name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the change you have in mind. Features
        that need a new third-party service should explain how it is configured
        and what happens when it is not.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback
        - Browsing and search
        - Library and tracking
        - Downloads
        - Manga reader
        - Themes and layout
        - Web client
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep it as small as possible; note alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: What would you leave out of a first version?
    validations:
      required: false
