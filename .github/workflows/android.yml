name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          # The runner ships cmdline-tools; calling sdkmanager directly avoids
          # setup-android's obsolete `sdkmanager tools` bootstrap step.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Inject TMDB API key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s/YOUR_TMDB_API_KEY/$TMDB_API_KEY/" src/config/env.ts
          else
            echo "::warning::TMDB_API_KEY secret is not set; the APK will show the setup screen until a key is added."
          fi

      - name: Verify project
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/AniFox-${VERSION}.apk"
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniFox-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      # Keep the Gradle/AGP report around when packaging fails, so a failed run
      # is diagnosable from the workflow artifacts instead of only the log.
      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-report
          path: |
            android/app/build/reports/**
            android/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
