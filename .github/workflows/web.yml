name: Web client

permissions:
  contents: read

on:
  push:
    branches: [main, anifox]
    paths:
      - "website/**"
      - "server/anifox-manga-api/server/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "website/**"
      - "server/anifox-manga-api/server/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          TMDB_API_KEY: ci-placeholder
          ANIFOX_API_URL: ${{ vars.ANIFOX_API_URL || 'https://anifox.invalid' }}

      - name: Build Cloudflare Worker bundle
        run: npm run cloudflare:build
        env:
          TMDB_API_KEY: ci-placeholder
          ANIFOX_API_URL: ${{ vars.ANIFOX_API_URL || 'https://anifox.invalid' }}
