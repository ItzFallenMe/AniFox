name: Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true
      send_notification:
        description: 'Send Discord Notification'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag to build (empty = latest pushed tag)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.44.0'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

# Cancel superseded runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Extract version from pubspec.yaml
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version_code: ${{ steps.get-version.outputs.version_code }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Determine tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TARGET_TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          elif [ "${{ github.event_name }}" = "push" ]; then
            TARGET_TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          echo "Target tag: $TARGET_TAG"

      - name: Checkout target tag
        if: ${{ steps.get-tag.outputs.tag != '' }}
        run: git checkout ${{ steps.get-tag.outputs.tag }}

      - name: Extract version
        id: get-version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION+$VERSION_CODE"

      - name: Check tag matches pubspec
        if: ${{ steps.get-tag.outputs.tag != '' }}
        run: |
          TAG_V="${{ steps.get-tag.outputs.tag }}"
          TAG_V="${TAG_V#v}"
          PUB_V="${{ steps.get-version.outputs.version }}"
          if [ "$TAG_V" != "$PUB_V" ]; then
            echo "::error::Tag v$TAG_V does not match pubspec version $PUB_V. Bump pubspec or retag."
            exit 1
          fi
          echo "Tag matches pubspec version."

  # VALIDATE (fail fast before expensive builds)
  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag != '' && needs.extract-version.outputs.tag || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # ANDROID BUILDS
  build-android-apk:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [extract-version, validate]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=release-keystore.jks" >> android/key.properties
            echo "Keystore configured for signing"
          else
            echo "No keystore configured - using debug signing"
            echo "storePassword=android" > android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "keyAlias=androiddebugkey" >> android/key.properties
            echo "storeFile=/tmp/debug.keystore" >> android/key.properties
            keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
      - name: Build Universal APK
        run: |
          flutter build apk \
            --release \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Build Split APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          # Rename split + universal APKs
          cp app-release.apk anifox-${{ needs.extract-version.outputs.version }}-universal.apk
          mv app-armeabi-v7a-release.apk anifox-${{ needs.extract-version.outputs.version }}-armeabi-v7a.apk 2>/dev/null || true
          mv app-arm64-v8a-release.apk anifox-${{ needs.extract-version.outputs.version }}-arm64-v8a.apk 2>/dev/null || true
          mv app-x86_64-release.apk anifox-${{ needs.extract-version.outputs.version }}-x86_64.apk 2>/dev/null || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/anifox-*.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # WINDOWS BUILD
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    needs: [extract-version, validate]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Build Windows
        run: >
          flutter build windows --release
          --dart-define-from-file=.env
          --build-number=${{ needs.extract-version.outputs.version_code }}
          --build-name=${{ needs.extract-version.outputs.version }}

      - name: Archive Windows build
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../../../windows.zip ./*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows.zip
          retention-days: 30

  # LINUX BUILD
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: [extract-version, validate]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # System libs required by the Flutter Linux plugins, discovered by
          # scanning pkg_check_modules() in each plugin's CMakeLists.txt:
          #   webkit2gtk-4.1 <- desktop_webview_window / flutter_web_auth_2
          #   libsecret-1     <- flutter_secure_storage_linux
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Build Linux
        run: >
          flutter build linux --release
          --dart-define-from-file=.env
          --build-number=${{ needs.extract-version.outputs.version_code }}
          --build-name=${{ needs.extract-version.outputs.version }}

      - name: Archive Linux build
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../linux.zip ./*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux.zip
          retention-days: 30

  # MACOS BUILD (unsigned; notarize/sign before store distribution)
  build-macos:
    name: macOS Build
    runs-on: macos-latest
    needs: [extract-version, validate]
    # macOS builds are unsigned and can be flaky on CI — don't block other
    # platform releases if it fails.
    continue-on-error: true
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag != '' && needs.extract-version.outputs.tag || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Build macOS
        run: >
          flutter build macos --release
          --dart-define-from-file=.env
          --build-number=${{ needs.extract-version.outputs.version_code }}
          --build-name=${{ needs.extract-version.outputs.version }}

      - name: Archive macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../macos.zip ./*.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos.zip
          retention-days: 30

  # CREATE RELEASE
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
    - extract-version
    - validate
    - build-android-apk
    - build-windows
    - build-linux
    - build-macos
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f

      - name: Collect release assets
        run: |
          mkdir release-files
          find artifacts -type f -name "*.apk" -exec cp {} release-files/ \;
          find artifacts -type f -name "windows.zip" -exec cp {} release-files/ \;
          find artifacts -type f -name "linux.zip" -exec cp {} release-files/ \;
          find artifacts -type f -name "macos.zip" -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files

      - name: Detect prerelease
        id: pre
        run: |
          if [[ "${{ needs.extract-version.outputs.version }}" =~ (alpha|beta|rc) ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.extract-version.outputs.version }}
          name: v${{ needs.extract-version.outputs.version }}
          draft: false
          prerelease: ${{ steps.pre.outputs.value }}
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Release
    needs: [create-release]
    if: ${{ always() && needs.create-release.result == 'success' && inputs.send_notification == true }}
    uses: ./.github/workflows/Notify.yml
    secrets: inherit
