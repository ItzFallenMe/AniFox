name: Release app builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag to create or release (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag and configuration
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      app_version: ${{ steps.release.outputs.app_version }}
      build_number: ${{ steps.release.outputs.build_number }}
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
      ANIFOX_API_URL: ${{ secrets.ANIFOX_API_URL || vars.ANIFOX_API_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version, source commit, and release configuration
        id: release
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example v1.0.0)."
            exit 1
          fi

          if ! node -e '
            const url = new URL(process.env.ANIFOX_API_URL);
            if (url.protocol !== "https:" || url.pathname !== "/" || url.search || url.hash) process.exit(1);
          ' 2>/dev/null; then
            echo "::error::Set ANIFOX_API_URL as a repository secret or Actions variable to the HTTPS website origin only (do not append /api or a path)."
            exit 1
          fi

          missing=0
          for key in TMDB_API_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required release configuration: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::The selected workflow commit does not match existing tag $RELEASE_TAG. Run the workflow from that tag."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::The pushed release tag $RELEASE_TAG could not be found in the checkout."
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    needs: validate
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      ANIFOX_API_URL: ${{ secrets.ANIFOX_API_URL || vars.ANIFOX_API_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install dependencies
        run: npm run flutter -- pub get

      - name: Analyze Flutter app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Test manga API adapters
        run: npm run api:test

      - name: Validate release configuration and signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for key in ANIFOX_API_URL TMDB_API_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required release configuration: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release.jks
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore/release.jks
          PROPS
          keytool -list -keystore android/app/keystore/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build split APKs
        run: >-
          npm run flutter -- build apk --release --no-pub --split-per-abi
          --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"
          --target-platform android-arm,android-arm64,android-x64

      - name: Build universal APK
        run: >-
          npm run flutter -- build apk --release --no-pub
          --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Build Play Store app bundle
        run: >-
          npm run flutter -- build appbundle --release --no-pub
          --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Assemble Android release packages
        run: |
          cd build/app/outputs/flutter-apk
          tag="${RELEASE_TAG}"
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "anifox-${tag}-${abi}.apk"
          done
          if [ -f app-release.apk ]; then
            mv app-release.apk "anifox-${tag}-universal.apk"
          fi
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            test -s "anifox-${tag}-${abi}.apk"
          done
          ls -lh
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp anifox-*.apk "$GITHUB_WORKSPACE/release-output/"
          cp "$GITHUB_WORKSPACE/build/app/outputs/bundle/release/app-release.aab" \
            "$GITHUB_WORKSPACE/release-output/anifox-${tag}-play-store.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anifox-release-android
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Build ${{ matrix.platform }} desktop package
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: windows
          - platform: linux-x64
            runner: ubuntu-24.04
            target: linux
          - platform: macos
            runner: macos-15
            target: macos
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      ANIFOX_API_URL: ${{ secrets.ANIFOX_API_URL || vars.ANIFOX_API_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Install Flutter dependencies
        run: npm run flutter -- pub get

      - name: Build desktop app
        shell: bash
        run: >-
          npm run flutter -- build "${{ matrix.target }}" --release --no-pub
          --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Package Windows build
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release/*"
          $destination = "build/anifox-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path $source -DestinationPath $destination -CompressionLevel Optimal

      - name: Package Linux build
        if: matrix.target == 'linux'
        run: >-
          tar -czf "build/anifox-${RELEASE_TAG}-linux-x64.tar.gz"
          -C build/linux/x64/release/bundle .

      - name: Package macOS build
        if: matrix.target == 'macos'
        run: |
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          case "$(uname -m)" in
            arm64) mac_arch=arm64 ;;
            x86_64) mac_arch=x64 ;;
            *) echo "::error::Unsupported macOS architecture: $(uname -m)"; exit 1 ;;
          esac
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "build/anifox-${RELEASE_TAG}-macos-${mac_arch}.zip"

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: anifox-release-${{ matrix.platform }}
          path: build/anifox-${{ env.RELEASE_TAG }}-*
          if-no-files-found: error
          retention-days: 30

  ios-unsigned:
    name: Build unsigned iOS app for verification
    runs-on: macos-15
    needs: validate
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      ANIFOX_API_URL: ${{ secrets.ANIFOX_API_URL || vars.ANIFOX_API_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter dependencies
        run: npm run flutter -- pub get

      - name: Build unsigned iOS app
        run: >-
          npm run flutter -- build ios --release --no-codesign --no-pub
          --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Upload unsigned iOS verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: anifox-ios-unsigned-not-for-install
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Android and desktop packages
    needs: [validate, android, desktop, ios-unsigned]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v4
        with:
          pattern: anifox-release-*
          path: release-assets
          merge-multiple: true

      - name: Check release assets
        run: |
          find release-assets -maxdepth 1 -type f -print
          for asset in \
            "anifox-${RELEASE_TAG}-armeabi-v7a.apk" \
            "anifox-${RELEASE_TAG}-arm64-v8a.apk" \
            "anifox-${RELEASE_TAG}-x86_64.apk" \
            "anifox-${RELEASE_TAG}-universal.apk" \
            "anifox-${RELEASE_TAG}-play-store.aab" \
            "anifox-${RELEASE_TAG}-windows-x64.zip" \
            "anifox-${RELEASE_TAG}-linux-x64.tar.gz"; do
            test -s "release-assets/$asset" || {
              echo "::error::Missing release package: $asset"
              exit 1
            }
          done
          compgen -G "release-assets/anifox-${RELEASE_TAG}-macos-*.zip" >/dev/null || {
            echo "::error::Missing macOS release package."
            exit 1
          }

      - name: Generate release checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AniFox ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
