name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install dependencies
        run: flutter pub get

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured — the APK will be debug-signed."
            exit 0
          fi
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release.jks
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore/release.jks
          PROPS

      - name: Build split APKs
        run: >-
          flutter build apk --release --no-pub --split-per-abi
          --target-platform android-arm,android-arm64,android-x64

      - name: Build universal APK
        run: flutter build apk --release --no-pub

      - name: Name APKs and checksums
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "anifox-${GITHUB_REF_NAME}-${abi}.apk"
          done
          if [ -f app-release.apk ]; then
            mv app-release.apk "anifox-${GITHUB_REF_NAME}-universal.apk"
          fi
          sha256sum anifox-*.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anifox-release-apks
          path: |
            build/app/outputs/flutter-apk/anifox-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AniFox ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/anifox-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
